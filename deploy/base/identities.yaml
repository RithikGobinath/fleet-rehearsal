apiVersion: v1
kind: Namespace
metadata: {name: fleet}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-api}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-worker}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-observations}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-console}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-kafka}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: {name: fleet-runtime}
data:
  FLEET_DEMO_MODE: hosted
  FLEET_KAFKA_BOOTSTRAP: kafka:9092
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: fleet-gp3}
provisioner: ebs.csi.aws.com
parameters: {type: gp3, encrypted: 'true'}
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
