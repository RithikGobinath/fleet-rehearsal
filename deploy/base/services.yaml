apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app: fleet-api}
  ports: [{name: http, port: 8000}]
---
apiVersion: v1
kind: Service
metadata: {name: web}
spec:
  selector: {app: fleet-console}
  ports: [{name: http, port: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: kafka}
spec:
  clusterIP: None
  selector: {app: fleet-kafka}
  ports: [{name: broker, port: 9092}]
