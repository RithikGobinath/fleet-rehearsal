apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-ingress}
spec:
  podSelector: {matchLabels: {app: fleet-api}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: fleet-console}}}]
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: kafka-ingress}
spec:
  podSelector: {matchLabels: {app: fleet-kafka}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: fleet-observations}}}]
      ports: [{protocol: TCP, port: 9092}]
