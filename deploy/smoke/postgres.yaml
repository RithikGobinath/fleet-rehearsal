apiVersion: v1
kind: Secret
metadata: {name: fleet-runtime-secrets}
stringData:
  DATABASE_URL: postgresql://fleet@postgres:5432/fleet
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: fleet-postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres}
spec:
  selector: {matchLabels: {app: fleet-postgres}}
  template:
    metadata: {labels: {app: fleet-postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
          env:
            - {name: POSTGRES_DB, value: fleet}
            - {name: POSTGRES_USER, value: fleet}
            - {name: POSTGRES_HOST_AUTH_METHOD, value: trust}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -h, 127.0.0.1, -U, fleet]}, periodSeconds: 3}
