name: Event recovery
on:
  pull_request:

permissions:
  contents: read

jobs:
  event-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start PostgreSQL, API, console, and Kafka
        run: docker compose --profile events up --build --wait kafka api web
      - name: Rehearse pending and projected evidence in Chromium
        working-directory: web
        env:
          FLEET_E2E_EVENTS: '1'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e -- rehearsal.spec.ts
      - name: Reconnect and verify broker redelivery after projection
        run: docker compose exec -T -e FLEET_KAFKA_BOOTSTRAP=kafka:9092 api python -m unittest discover -s tests -p test_observations.py -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: synthetic-rehearsal-screenshots
          path: web/test-results/**/*.png
          if-no-files-found: ignore
      - name: Print service logs on failure
        if: failure()
        run: docker compose --profile events logs --no-color
      - name: Stop the disposable stack
        if: always()
        run: docker compose --profile events down -v
