services:
  db:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "fleet", "-d", "fleet"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - fleet-db:/var/lib/postgresql/data
    networks: [data]
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://fleet@db:5432/fleet
      FLEET_DEMO_MODE: local
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [app, data]
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports: ["127.0.0.1:${FLEET_WEB_PORT:-8080}:8080"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [app]
  worker:
    profiles: [rehearsal]
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "-m", "fleet.worker"]
    environment:
      DATABASE_URL: postgresql://fleet@db:5432/fleet
      FLEET_DEMO_MODE: local
    depends_on:
      api:
        condition: service_healthy
    networks: [data]
  kafka:
    profiles: [events]
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - fleet-kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "127.0.0.1:9092", "--list"]
      interval: 4s
      timeout: 6s
      retries: 20
    networks: [data]
  observation-relay: &observation_worker
    profiles: [events]
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "-m", "fleet.event_worker", "relay"]
    environment:
      DATABASE_URL: postgresql://fleet@db:5432/fleet
      FLEET_DEMO_MODE: local
      FLEET_KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      api:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure
    networks: [data]
  observation-projector:
    <<: *observation_worker
    command: ["python", "-m", "fleet.event_worker", "project"]
volumes:
  fleet-db:
  fleet-kafka:
networks:
  app:
  data:
    internal: true
