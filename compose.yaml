services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "fleet", "-d", "fleet"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - fleet-db:/var/lib/postgresql/data
    networks: [data]
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://fleet@db:5432/fleet
      FLEET_DEMO_MODE: local
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [app, data]
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports: ["127.0.0.1:${FLEET_WEB_PORT:-8080}:8080"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [app]
  worker:
    profiles: [rehearsal]
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "-m", "fleet.worker"]
    environment:
      DATABASE_URL: postgresql://fleet@db:5432/fleet
      FLEET_DEMO_MODE: local
    depends_on:
      api:
        condition: service_healthy
    networks: [data]
volumes:
  fleet-db:
networks:
  app:
  data:
    internal: true
